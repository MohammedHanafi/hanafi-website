backend:
  name: git-gateway
  branch: main

# After you deploy on Netlify and turn on Identity + Git Gateway (see README.md),
# publishing a post here commits a new Markdown file to src/posts/ in your repo,
# and Netlify rebuilds the site automatically. No code editing needed.

publish_mode: simple
media_folder: "src/img/uploads"
public_folder: "/img/uploads"

# How the address (file name) of a new article is cleaned up
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "Blog posts"
    folder: "src/posts"
    create: true
    identifier_field: "slug"
    summary: "{{title}}"
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "URL slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use only lowercase letters, numbers and single hyphens, for example birmingham-business-school-scholarships-2027"]
        hint: "The permanent web address of this article: yoursite/posts/THIS-PART/ . Fill it in when you first create the article, using a few relevant words (for example birmingham-business-school-scholarships-2027). It becomes the file name, so changing it later does NOT change the address. For articles published before this box existed, type the same words as their current address."
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Last updated", name: "updated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Optional. Set this when you make a real change to an old article; search engines use it." }
      - { label: "Author", name: "author", widget: "string", default: "Mohammed Hanafi", hint: "Shown on the article cards." }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Education"
        options: ["Education", "Politics", "Sports", "Technology", "Entertainment", "Scholarship"]
      - { label: "Cover image", name: "image", widget: "image", required: false, hint: "Optional. If left empty, the icon below is shown instead." }
      - { label: "Video (optional)", name: "video", widget: "string", required: false, hint: "Optional. Paste a YouTube video link (e.g. https://www.youtube.com/watch?v=xxxxxxxxxxx or a youtu.be link) to embed it near the top of the article." }
      - label: "Icon"
        name: "icon"
        widget: "select"
        default: "fa-graduation-cap"
        options:
          - { label: "Graduation cap", value: "fa-graduation-cap" }
          - { label: "Lightbulb", value: "fa-lightbulb" }
          - { label: "Book", value: "fa-book" }
          - { label: "Megaphone", value: "fa-bullhorn" }
          - { label: "Chalkboard", value: "fa-chalkboard-teacher" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentences shown on the blog list and used as the page description." }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "notes"
    label: "Lesson notes"
    folder: "src/notes"
    create: true
    extension: "md"
    format: "frontmatter"
    media_folder: "/src/downloads"
    public_folder: "/downloads"
    summary: "{{schoolClass}} {{term}} Week {{week}}: {{subject}} - {{title}}"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    fields:
      - { label: "Term", name: "term", widget: "select", options: ["Term 1", "Term 2", "Term 3"] }
      - { label: "Class", name: "schoolClass", widget: "select", options: ["KG 1", "KG 2", "Basic 1", "Basic 2", "Basic 3", "Basic 4", "Basic 5", "Basic 6", "Basic 7", "Basic 8", "Basic 9"] }
      - label: "Subject"
        name: "subject"
        widget: "select"
        options: ["English Language", "Mathematics", "Science", "Religious and Moral Education", "History", "Social Studies", "Creative Arts", "Creative Arts and Design", "Career Technology", "Computing", "Ghanaian Language", "General"]
        hint: "Lower Primary (Basic 1-3): English Language, Mathematics, Science, Religious and Moral Education, History, Creative Arts, Ghanaian Language. Upper Primary (Basic 4-6): the same plus Computing. JHS (Basic 7-9): English Language, Mathematics, Science, Religious and Moral Education, Social Studies, Career Technology, Creative Arts and Design, Computing, Ghanaian Language. Kindergarten: General."
      - { label: "Week", name: "week", widget: "number", value_type: "int", min: 1, max: 16, default: 1, hint: "The week of the term, for example 3 for Week 3." }
      - { label: "Title", name: "title", widget: "string", hint: "The topic for that week, for example: Addition of numbers up to 20" }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "Optional. One or two sentences about what the notes cover." }
      - { label: "File", name: "file", widget: "file", hint: "The notes people will download. PDF works best. Keep the file under about 5 MB (compress big PDFs first). You can also paste an https link instead, for example to Google Drive." }

  - name: "services"
    label: "Services page"
    files:
      - label: "Services and samples"
        name: "services"
        file: "src/_data/services.json"
        format: "json"
        fields:
          - label: "Services"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                default: "fa-briefcase"
                options:
                  - { label: "Paint brush (design)", value: "fa-paint-brush" }
                  - { label: "Code", value: "fa-code" }
                  - { label: "ID card", value: "fa-id-card" }
                  - { label: "School", value: "fa-school" }
                  - { label: "Laptop code", value: "fa-laptop-code" }
                  - { label: "Briefcase", value: "fa-briefcase" }
                  - { label: "Camera", value: "fa-camera" }
                  - { label: "Cogs", value: "fa-cogs" }
              - label: "Samples"
                name: "samples"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                hint: "Add pictures of your past work for this service. They appear when a visitor taps the service."
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
