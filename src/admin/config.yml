backend:
  name: git-gateway
  branch: main

# After you deploy on Netlify and turn on Identity + Git Gateway (see README.md),
# publishing a post here commits a new Markdown file to src/posts/ in your repo,
# and Netlify rebuilds the site automatically. No code editing needed.

publish_mode: simple
media_folder: "src/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "posts"
    label: "Blog posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "Mohammed Hanafi", hint: "Shown on the article cards." }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Education"
        options: ["Education", "Politics", "Sports", "Technology", "Entertainment", "Scholarship"]
      - { label: "Cover image", name: "image", widget: "image", required: false, hint: "Optional. If left empty, the icon below is shown instead." }
      - { label: "Video (optional)", name: "video", widget: "string", required: false, hint: "Optional. Paste a YouTube video link (e.g. https://www.youtube.com/watch?v=xxxxxxxxxxx or a youtu.be link) to embed it near the top of the article." }
      - label: "Icon"
        name: "icon"
        widget: "select"
        default: "fa-graduation-cap"
        options:
          - { label: "Graduation cap", value: "fa-graduation-cap" }
          - { label: "Lightbulb", value: "fa-lightbulb" }
          - { label: "Book", value: "fa-book" }
          - { label: "Megaphone", value: "fa-bullhorn" }
          - { label: "Chalkboard", value: "fa-chalkboard-teacher" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentences shown on the blog list and used as the page description." }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "services"
    label: "Services page"
    files:
      - label: "Services and samples"
        name: "services"
        file: "src/_data/services.json"
        format: "json"
        fields:
          - label: "Services"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                default: "fa-briefcase"
                options:
                  - { label: "Paint brush (design)", value: "fa-paint-brush" }
                  - { label: "Code", value: "fa-code" }
                  - { label: "ID card", value: "fa-id-card" }
                  - { label: "School", value: "fa-school" }
                  - { label: "Laptop code", value: "fa-laptop-code" }
                  - { label: "Briefcase", value: "fa-briefcase" }
                  - { label: "Camera", value: "fa-camera" }
                  - { label: "Cogs", value: "fa-cogs" }
              - label: "Samples"
                name: "samples"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                hint: "Add pictures of your past work for this service. They appear when a visitor taps the service."
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
